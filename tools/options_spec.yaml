      palette: {bg_deep: "#110909", bg: "#221313", panel: "#180D0D", control: "#331C1C", text: "#F8EEEE", text_dim: "#B79C9C", accent: "#FF6B6B",
                accent2: "#FF9F6B", play: "#E5484D", positive: "#7FD48A", mixed: "#F4D35E", negative: "#FF5A5F", orange: "#F08A4B"}
    - id: Forest
