# Tooltips: shown in the theme workshop and in Theme Options (as the variable Description).
tips:
  HeroMinHeight: {en: 'Minimum height of the artwork header at the top of the Details view.', fr: 'Hauteur minimale de l''en-tête avec l''image, en haut de la vue Détails.'}
  HeroActionButtonWidth: {en: 'Total width of the Play, Edit and Favorite row.', fr: 'Largeur totale de la rangée Jouer, Modifier et Favori.'}
  HeroActionButtonHeight: {en: 'Height of the Play button and of the square buttons next to it.', fr: 'Hauteur du bouton Jouer et des boutons carrés à côté.'}
  GameLogoMaxWidth: {en: 'Largest width of the game logo (Extra Metadata Loader).', fr: 'Largeur maximale du logo du jeu (Extra Metadata Loader).'}
  GameLogoMaxHeight: {en: 'Largest height of the game logo (Extra Metadata Loader).', fr: 'Hauteur maximale du logo du jeu (Extra Metadata Loader).'}
  DetailsViewShowEditButton: {en: 'Pencil button that opens the game editor.', fr: 'Bouton crayon qui ouvre l''édition du jeu.'}
  DetailsViewShowFavoriteButton: {en: 'Star button that adds or removes the game from favorites. Needs ThemeExtras.', fr: 'Bouton étoile pour ajouter ou retirer le jeu des favoris. Demande ThemeExtras.'}
  HeroShowSteamShortcuts: {en: 'Button with the Steam client, store, community and guides pages. Needs Steam Shortcuts.', fr: 'Bouton vers le client, le magasin, la communauté et les guides Steam. Demande Steam Shortcuts.'}
  HeroShowUpdateStatus: {en: 'Dot that shows when a Steam or Epic update is available. Needs Game Update Status.', fr: 'Pastille qui signale une mise à jour Steam ou Epic. Demande Game Update Status.'}
  DetailsViewAllowUseOfLogos: {en: 'Shows the game logo instead of its name when Extra Metadata Loader has one.', fr: 'Affiche le logo du jeu à la place de son nom quand Extra Metadata Loader en a un.'}
  DetailsViewDisplayGameNameIfLogoVisible: {en: 'Keeps the game name under the logo.', fr: 'Garde le nom du jeu sous le logo.'}
  HeroShowInfoLine: {en: 'The chips under the title (date, platforms, genres, times...). The gear at the start of the chips line sets each chip.', fr: 'Les puces sous le titre (date, plateformes, genres, durées...). L''engrenage au début de la ligne règle chaque puce.'}
  HeroInfoLineMaxWidth: {en: 'Width after which the chips wrap to a new line.', fr: 'Largeur au-delà de laquelle les puces passent à la ligne.'}
  DetailsViewShowHeaderBar: {en: 'The bar under the artwork with the last played date, time played and completion status.', fr: 'La barre sous l''image avec la dernière partie, le temps de jeu et le statut.'}
  DetailsViewShowLastPlayed: {en: 'Date of the last session.', fr: 'Date de la dernière session.'}
  DetailsViewShowPlayTime: {en: 'Total time played.', fr: 'Temps de jeu total.'}
  DetailsViewShowCompletionStatus: {en: 'Completion status, which ThemeExtras lets you change from here.', fr: 'Statut de complétion, modifiable ici avec ThemeExtras.'}
  DetailsViewShowAchievementsSummary: {en: 'Unlocked achievements with a progress bar. Needs PlayniteAchievements.', fr: 'Succès débloqués avec une barre de progression. Demande PlayniteAchievements.'}
  HltbShowInHeaderBar: {en: 'HowLongToBeat main story time in the bar.', fr: 'Durée HowLongToBeat de l''histoire dans la barre.'}
  DetailsViewShowUserRating: {en: 'Your rating as clickable stars. Needs ThemeExtras.', fr: 'Votre note en étoiles cliquables. Demande ThemeExtras.'}
  DetailsViewShowInfoButton: {en: 'Button that shows or hides the information panel (cover, description, details).', fr: 'Bouton qui affiche ou masque le panneau d''informations (pochette, description, détails).'}
  HeaderButtonSize: {en: 'Size of the round buttons in the header bar.', fr: 'Taille des boutons ronds de la barre d''en-tête.'}
  HltbShowOnCover: {en: 'HowLongToBeat main story time in a corner of the cover.', fr: 'Durée HowLongToBeat de l''histoire dans un coin de la pochette.'}
  AchievementsShowOnCover: {en: 'Unlocked and total achievements in a corner of the cover.', fr: 'Succès débloqués et total dans un coin de la pochette.'}
  LibraryListShowHltb: {en: 'HowLongToBeat time at the end of each game in the list. Turn on "view item" in the HowLongToBeat settings.', fr: 'Durée HowLongToBeat au bout de chaque jeu de la liste. Activez l''élément de vue dans les paramètres de HowLongToBeat.'}
  LibraryListShowAchievements: {en: 'Unlocked and total achievements at the end of each game in the list. Can slow down very large libraries.', fr: 'Succès débloqués et total au bout de chaque jeu de la liste. Peut ralentir les très grandes bibliothèques.'}
  GridCoverShowHltb: {en: 'HowLongToBeat time on each cover of the Grid view.', fr: 'Durée HowLongToBeat sur chaque jaquette de la vue Grille.'}
  GridCoverShowAchievements: {en: 'Achievements on each cover of the Grid view.', fr: 'Succès sur chaque jaquette de la vue Grille.'}
  DemoteSectionsShownElsewhere: {en: 'A section whose information is already shown above folds at the bottom of its column. Each section can opt out in its gear.', fr: 'Une section dont l''info est déjà affichée en haut se replie en bas de sa colonne. Chaque section peut s''en exclure dans son engrenage.'}
  DetailsViewUseMetadataUtilities: {en: 'Genres, categories, features and tags grouped by prefix. Needs Metadata Utilities and its prefixes.', fr: 'Genres, catégories, fonctionnalités et étiquettes regroupés par préfixe. Demande Metadata Utilities et ses préfixes.'}
  DetailsViewShowHiddenButton: {en: 'Eye button that hides the game from the library or shows it again. Needs ThemeExtras.', fr: 'Bouton œil qui masque le jeu de la bibliothèque ou le réaffiche. Demande ThemeExtras.'}
  HeroShowAvgFps: {en: 'Average FPS over all recorded sessions. Needs GameActivity with FPS logging.', fr: 'FPS moyen sur toutes les sessions enregistrées. Demande GameActivity avec le relevé des FPS.'}
  TopPanelShowCollectorLevel: {en: 'Collection level of your library, with its progress. Click to open the achievements overview.', fr: 'Niveau de collection de votre bibliothèque, avec sa progression. Cliquez pour ouvrir les succès.'}
  TopPanelAutoHide: {en: 'The top panel shrinks to a thin strip and comes back when the mouse is over it.', fr: 'La barre du haut se réduit à une fine bande et revient au passage de la souris.'}
  SidebarAutoHide: {en: 'The sidebar shrinks to a thin strip and comes back when the mouse is over it. Left or right sidebar only.', fr: 'La barre latérale se réduit à une fine bande et revient au passage de la souris. Barre à gauche ou à droite seulement.'}
  HeroChipsOpenSections: {en: 'A click on a chip opens or folds the matching section below. Times, achievements, activity, genres and tags.', fr: 'Un clic sur une puce ouvre ou replie la section liée plus bas. Durées, succès, activité, genres et étiquettes.'}
  DetailsViewTabsMode: {en: 'Tabs above the sections: All, About, Media, Stats, Community. The gear of each section sets its tab, 0 = every tab.', fr: 'Des onglets au-dessus des sections : Tout, Infos, Médias, Stats, Communauté. L''engrenage de chaque section règle son onglet, 0 = tous.'}
  DetailsViewShowInfoPanelDefault: {en: 'Information panel (cover, description, details) open when a game is selected.', fr: 'Panneau d''informations (pochette, description, détails) ouvert quand un jeu est sélectionné.'}
  SectionHeaderMinHeight: {en: 'Height of the section titles with their fold arrow and gear.', fr: 'Hauteur des titres de section avec leur flèche et leur engrenage.'}
  DetailsViewDescriptionWidth: {en: 'Width of the game description.', fr: 'Largeur de la description du jeu.'}
  DetailsViewDescriptionMaxHeight: {en: 'Height after which the description scrolls.', fr: 'Hauteur au-delà de laquelle la description défile.'}
  AchievementsDataGridMaxHeight: {en: 'Height after which the full achievements table scrolls.', fr: 'Hauteur au-delà de laquelle le tableau complet des succès défile.'}
  LinksShowNames: {en: 'Shows the name next to each link icon. Off: icons only.', fr: 'Affiche le nom à côté de chaque icône de lien. Désactivé : icônes seules.'}
  LinkIconSize: {en: 'Size of the link icons (favicons).', fr: 'Taille des icônes de liens (favicons).'}
  TopPanelHeight: {en: 'Height of the bar at the top of the window.', fr: 'Hauteur de la barre en haut de la fenêtre.'}
  ShowNavigationButtons: {en: 'Back and forward buttons. Need ThemeExtras.', fr: 'Boutons précédent et suivant. Demandent ThemeExtras.'}

# Settings panel: one panel with a page list on the left, generated into the Details view
# (opened by the section gears) and into both top panels (opened by the workshop button).
# Booleans become switches, Doubles with a range become sliders.
panel:
  pages:
  - id: Chips
    en: Chips
    fr: Puces
    desc:
      en: 'The pills on the artwork: which ones, in which order, and where a new line starts.'
      fr: "Les puces sur l'illustration : lesquelles, dans quel ordre, et où commence une nouvelle ligne."
    desc:
      en: 'The bar under the artwork: last played, play time, status, ratings and its round buttons.'
      fr: "La barre sous l'illustration : dernière partie, temps de jeu, statut, notes et ses boutons ronds."
    glyph: 
    kind: chips
    groups:
    - en: Chips line
      fr: Ligne de puces
      items:
      - HeroShowInfoLine
      - HeroInfoLineMaxWidth
      - HeroChipsOpenSections
  - id: Header
    en: Artwork header
    fr: En-tête avec image
    desc:
      en: 'Height of the artwork header, the game logo and the buttons next to Play.'
      fr: "Hauteur de l'en-tête illustré, logo du jeu et boutons à côté de Jouer."
    glyph: 
    groups:
    - en: Size and buttons
      fr: Taille et boutons
      items:
      - HeroMinHeight
      - HeroActionButtonWidth
      - HeroActionButtonHeight
      - GameLogoMaxWidth
      - GameLogoMaxHeight
      - DetailsViewShowEditButton
      - DetailsViewShowFavoriteButton
      - DetailsViewShowHiddenButton
      - HeroShowSteamShortcuts
      - HeroShowUpdateStatus
      - DetailsViewAllowUseOfLogos
      - DetailsViewDisplayGameNameIfLogoVisible
  - id: HeaderBar
    en: Header bar
    fr: Barre d'en-tête
    glyph: 
    groups:
    - en: Items
      fr: Éléments
      items:
      - DetailsViewShowHeaderBar
      - DetailsViewShowLastPlayed
      - DetailsViewShowPlayTime
      - DetailsViewShowCompletionStatus
