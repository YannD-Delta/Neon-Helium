# Single source of truth for the theme settings.
#
# python tools/build_options.py writes from this file:
#   source/options.yaml              ThemeOptions presets (drop-down lists) and variables
#   source/Localization/fr_FR.xaml   French labels (ThemeOptions loads them when Playnite is in French)
#   source/thememodifier.yaml        ThemeModifier color pickers
#   source/Presets/**/*.xaml         preset resource files, and the default hero styles in
#                                    source/DerivedStyles/PlayButton.xaml (templates in build_options.py)
#
# Types and default values are read from source/Constants.xaml, so they cannot drift.
# Preset constants must not be variables: Theme Options saves every current value on exit,
# so a value set by a preset would come back as a user setting and stay after the preset changes.
# Presets use their own keys (HeroStyleShowInfoLine...), combined with the variables in the views.
#
# Ranges become ThemeOptions sliders. Only whole-number steps are used: ThemeOptions stores
# slider values as text and a decimal comma would break the generated resources.

strings:
  LOCHNDThemeSettingsTooltip: {en: 'Theme settings (Theme Options)', fr: 'Réglages du thème (Theme Options)'}
  LOCHNDChipAchievements: {en: Achievements, fr: Succès}
  LOCHNDChipScore: {en: Score, fr: Note}
  LOCHNDChipHltbMain: {en: Main, fr: Histoire}
  LOCHNDChipHltbExtra: {en: Main + Extra, fr: Histoire + extras}
  LOCHNDChipHltbCompletionist: {en: "100%", fr: "100 %"}
  LOCHNDChipLastSession: {en: Last session, fr: Dernière session}
  LOCHNDChipAvgFps: {en: Avg FPS, fr: FPS moy.}
  LOCHNDTileScores: {en: 'Critics · Community', fr: 'Critiques · Communauté'}
  LOCHNDTileRecentActivity: {en: Recent activity, fr: Activité récente}
  LOCHNDTileHltbExtra: {en: 'HLTB · Main + Extra', fr: 'HLTB · Histoire + extras'}
  LOCHNDTileHltbCompletionist: {en: 'HLTB · 100%', fr: 'HLTB · 100 %'}
  LOCHNDTileRare: {en: 'Rare · Ultra rare', fr: 'Rares · Ultra rares'}
  LOCHNDFavoriteButtonTooltip: {en: Favorite (ThemeExtras), fr: Favori (ThemeExtras)}
  LOCHNDHiddenButtonTooltip: {en: Hidden game (ThemeExtras), fr: Jeu masqué (ThemeExtras)}
  LOCHNDCollectorTooltip: {en: Collection level (PlayniteAchievements), fr: Niveau de collection (PlayniteAchievements)}
  LOCHNDCollectorLevel: {en: Lv., fr: Niv.}
  LOCHNDTabAll: {en: 'All', fr: 'Tout'}
  LOCHNDTabAbout: {en: 'About', fr: 'Infos'}
  LOCHNDTabMedia: {en: 'Media', fr: 'Médias'}
  LOCHNDTabStats: {en: 'Stats', fr: 'Stats'}
  LOCHNDTabCommunity: {en: 'Community', fr: 'Communauté'}
  LOCHNDChipLatestAchievement: {en: Latest, fr: Dernier succès}
  LOCHNDChipRare: {en: Rare, fr: Rares}
  LOCHNDChipUltraRare: {en: Ultra rare, fr: Ultra rares}
  LOCHNDSectionScreenshotUtilities: {en: Screenshots, fr: Captures d'écran}

presets:
  - group: Style
    en: Global style
    fr: Style global
    options:
      - id: Default
        en: Liquid Glass (card, blurred page, glass tiles)
        fr: Liquid Glass (carte, page floutée, tuiles en verre)
      - id: Dune
        en: Dune (text chips, taller and stronger blur)
        fr: Dune (infos en texte, flou plus haut et plus fort)
        files: [Presets/Chips/Text.xaml]
        constants:
          HeroShadeOpacity: 0.5
          HeroBlurRadiusSoft: 14
          HeroBlurRadius: 48
          HeroBlurStart: 0.3
          HeroBlurMid: 0.5
          HeroBlurFull: 0.8
      - id: Neon
        en: Neon (full-width artwork, buttons in a header bar)
        fr: Neon (image pleine largeur, boutons dans une barre)
        files: [Presets/Buttons/Neon.xaml]
        constants:
          HeroCardMargin: 0
          HeroCardCornerRadius: 0
          HeroCardBorderThickness: 0
          HeroFadeStart: 0.75
          HeroBlurOpacity: 0
          HeroTintAccentOpacity: 0
          HeroTintLightOpacity: 0
          HeroCoverPlacement: 2
          InfoPanelStyleShowCover: True
          HeroShadeOpacity: 0.25
          HeroActionsLocation: 1
          HeroStyleShowInfoLine: False
          PageGlassOpacity: 0
          DetailsViewBackgroundBlurOpacity: 0.25
          HeaderBarBlurOpacity: 1
          HeaderBarGlassOpacity: 1
          HeaderRowBackgroundOpacity: 1
          HeaderRowPadding: 20,10,30,10
          HeaderTileBackgroundOpacity: 0
          HeaderTilePadding: 0
          HeaderTileMargin: 20,0,0,0
      - id: Minimal
        en: Minimal (card only, no chips or tiles)
        fr: Minimal (carte seule, sans puces ni tuiles)
        constants:
          HeroStyleShowInfoLine: False
          HeaderBarStyleVisible: False
          HeroShadeOpacity: 0.5

  - group: Corners
    en: Corner rounding (card, panels, tiles, chips, buttons, cover)
    fr: Arrondi des coins (carte, panneaux, tuiles, puces, boutons, jaquette)
    options:
      - id: Default
        en: Rounded (Liquid Glass)
        fr: Arrondi (Liquid Glass)
      - id: Square
        en: Square
        fr: Carré
        constants: {HeroCardCornerRadius: 0, SectionCornerRadius: 0, HeaderTileCornerRadius: 0, HeroChipCornerRadius: 0, HeroButtonCornerRadius: 0, HeroCoverCornerRadius: 0}
      - id: Subtle
        en: Subtle
        fr: Léger
        constants: {HeroCardCornerRadius: 10, SectionCornerRadius: 8, HeaderTileCornerRadius: 8, HeroChipCornerRadius: 5, HeroButtonCornerRadius: 5, HeroCoverCornerRadius: 6}
      - id: Round
        en: Very round
        fr: Très arrondi
        constants: {HeroCardCornerRadius: 28, SectionCornerRadius: 20, HeaderTileCornerRadius: 18, HeroChipCornerRadius: 14, HeroButtonCornerRadius: 16, HeroCoverCornerRadius: 18}

  - group: PageBackground
    en: Page background
    fr: Fond de la page
    options:
      - id: Default
        en: Liquid glass (blurred artwork behind everything)
        fr: Verre liquide (image floutée derrière tout)
      - id: Clear
        en: Clear glass (brighter artwork)
        fr: Verre clair (image plus lumineuse)
        constants: {PageGlassOpacity: 1, PageGlassScrimOpacity: 0.35, PageGlassBlurRadius: 40, DetailsViewBackgroundBlurOpacity: 0}
      - id: Dark
        en: Smoked glass (darker)
        fr: Verre fumé (plus sombre)
        constants: {PageGlassOpacity: 1, PageGlassScrimOpacity: 0.75, PageGlassBlurRadius: 40, DetailsViewBackgroundBlurOpacity: 0}
      - id: Tinted
        en: Tinted glass (accent color)
        fr: Verre teinté (couleur d'accent)
        constants: {PageGlassOpacity: 1, PageGlassScrimOpacity: 0.55, PageGlassTintOpacity: 0.18, DetailsViewBackgroundBlurOpacity: 0}
      - id: Ambient
        en: Ambient reflection under the header only
        fr: Reflet sous l'en-tête seulement
        constants: {PageGlassOpacity: 0, DetailsViewBackgroundBlurOpacity: 0.25, GridViewBackgroundBlurOpacity: 0.25}
      - id: Solid
        en: Solid (color profile only)
        fr: Uni (profil de couleurs seulement)
        constants: {PageGlassOpacity: 0, DetailsViewBackgroundBlurOpacity: 0, GridViewBackgroundBlurOpacity: 0}

  - group: Glass
    en: Glass of the panels, tiles and chips
    fr: Verre des panneaux, tuiles et puces
    options:
      - id: Default
        en: Glass
        fr: Verre
      - id: Frosted
        en: Frosted (more opaque)
        fr: Dépoli (plus opaque)
        constants: {SectionGlassOpacity: 0.11, SectionGlassBorderOpacity: 0.14, ChipGlassOpacity: 0.12, HeaderTileBackgroundOpacity: 0.13}
      - id: Clear
        en: Clear (barely visible)
        fr: Clair (à peine visible)
        constants: {SectionGlassOpacity: 0.03, SectionGlassBorderOpacity: 0.07, ChipGlassOpacity: 0.04, HeaderTileBackgroundOpacity: 0.04}
      - id: Borderless
        en: Glass without outlines
        fr: Verre sans contours
        constants: {SectionGlassBorderOpacity: 0, HeroCardBorderThickness: 0}

  - group: HeroCard
    en: Artwork card size
    fr: Taille de la carte avec l'image
    options:
      - id: Default
        en: Spaced (20 px from the edges)
        fr: Espacée (20 px des bords)
      - id: Wide
        en: Wide spacing (40 px)
        fr: Très espacée (40 px)
        constants: {HeroCardMargin: '40,24,40,0', PageSideMargin: '40,0,40,0', PageLinksMargin: '40,12,40,12', HeroFadeStart: 1}
      - id: Tight
        en: Close to the edges (8 px)
        fr: Près des bords (8 px)
        constants: {HeroCardMargin: '8,8,8,0', PageSideMargin: '8,0,8,0', PageLinksMargin: '8,12,8,12', HeroFadeStart: 1}
      - id: FullWidth
        en: Full width, fading into the page
        fr: Pleine largeur, fondu dans la page
        constants: {HeroCardMargin: 0, HeroCardCornerRadius: 0, HeroCardBorderThickness: 0, HeroFadeStart: 0.75}

  - group: HeroBlur
    en: Blur at the bottom of the artwork
    fr: Flou en bas de l'image
    options:
      - id: Default
        en: Medium
        fr: Moyen
      - id: "Off"
        en: None (sharp artwork)
        fr: Aucun (image nette)
        constants: {HeroBlurOpacity: 0}
      - id: Light
        en: Light
        fr: Léger
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 4, HeroBlurRadius: 14}
      - id: Strong
        en: Strong
        fr: Fort
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 14, HeroBlurRadius: 48}
      - id: Extreme
        en: Very strong (frosted glass)
        fr: Très fort (verre dépoli)
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 24, HeroBlurRadius: 80}

  - group: HeroBlurHeight
    en: Height of the blurred band
    fr: Hauteur de la bande floutée
    options:
      - id: Default
        en: Bottom half
        fr: Moitié du bas
      - id: Small
        en: Bottom quarter
        fr: Quart du bas
        constants: {HeroBlurStart: 0.6, HeroBlurMid: 0.75, HeroBlurFull: 0.92}
      - id: Large
        en: Two thirds
        fr: Deux tiers
        constants: {HeroBlurStart: 0.3, HeroBlurMid: 0.5, HeroBlurFull: 0.8}
      - id: Full
        en: Whole artwork, blurrier towards the bottom
        fr: Toute l'image, de plus en plus floue vers le bas
        constants: {HeroBlurStart: 0, HeroBlurMid: 0.35, HeroBlurFull: 0.7}

  - group: HeroTint
    en: Color over the blurred band
    fr: Couleur sur la bande floutée
    options:
      - id: Default
        en: Light accent color
        fr: Couleur d'accent légère
      - id: None
        en: None (artwork colors)
        fr: Aucune (couleurs de l'image)
        constants: {HeroTintAccentOpacity: 0, HeroTintLightOpacity: 0}
      - id: AccentStrong
        en: Strong accent color
        fr: Couleur d'accent forte
        constants: {HeroTintAccentOpacity: 0.55, HeroTintLightOpacity: 0}
      - id: Frost
        en: White frost
        fr: Givre blanc
        constants: {HeroTintAccentOpacity: 0, HeroTintLightOpacity: 0.12}
      - id: AccentFrost
        en: Accent color and frost
        fr: Couleur d'accent et givre
        constants: {HeroTintAccentOpacity: 0.25, HeroTintLightOpacity: 0.08}

  - group: HeroShade
    en: Dark shade at the bottom of the artwork
    fr: Ombre en bas de l'image
    options:
      - id: Default
        en: Light
        fr: Légère
      - id: None
        en: None
        fr: Aucune
        constants: {HeroShadeOpacity: 0}
      - id: Medium
        en: Medium
        fr: Moyenne
        constants: {HeroShadeOpacity: 0.65}
      - id: Strong
        en: Strong
        fr: Forte
        constants: {HeroShadeOpacity: 0.85}

  - group: HeroCover
    en: Cover in the artwork card
    fr: Jaquette dans la carte
    options:
      - id: Default
        en: Over the card edge and the tiles
        fr: À cheval sur la carte et les tuiles
      - id: Inside
        en: Inside the card
        fr: Dans la carte
        constants: {HeroCoverPlacement: 1, InfoPanelStyleShowCover: False}
      - id: InsideKeepPanel
        en: Inside the card, also in the information panel
        fr: Dans la carte, et aussi dans le panneau d'informations
        constants: {HeroCoverPlacement: 1, InfoPanelStyleShowCover: True}
      - id: Hidden
        en: Information panel only
        fr: Panneau d'informations seulement
        constants: {HeroCoverPlacement: 2, InfoPanelStyleShowCover: True}

  - group: Buttons
    en: Play button style
    fr: Style du bouton Jouer
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Dune
        en: Dune (flat, rounded)
        fr: Dune (plat, arrondi)
        files: [Presets/Buttons/Dune.xaml]
      - id: Neon
        en: Neon (gradient, small caps)
        fr: Neon (dégradé, petites capitales)
        files: [Presets/Buttons/Neon.xaml]
      - id: Pill
        en: Pill (fully rounded)
        fr: Pilule (entièrement arrondi)
        files: [Presets/Buttons/Pill.xaml]
      - id: Glass
        en: Glass (outline, accent color)
        fr: Verre (contour, couleur d'accent)
        files: [Presets/Buttons/Glass.xaml]

  - group: ActionsLocation
    en: Play, edit and favorite buttons
    fr: Boutons Jouer, Modifier et Favori
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: HeroRight
        en: In the artwork, at the right of the information
        fr: Dans l'image, à droite des informations
        constants:
          HeroActionsLocation: 2
      - id: Hero
        en: In the artwork, under the chips (Dune)
        fr: Dans l'image, sous les puces (Dune)
        constants:
          HeroActionsLocation: 0
      - id: HeaderBar
        en: In the header bar (Neon)
        fr: Dans la barre d'en-tête (Neon)
        constants:
          HeroActionsLocation: 1

  - group: Chips
    en: Information chips in the artwork
    fr: Puces d'information dans l'image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Pills
        en: Pills
        fr: Pastilles
        files: [Presets/Chips/Pills.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Text
        en: Plain text (Dune)
        fr: Texte simple (Dune)
        files: [Presets/Chips/Text.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Outline
        en: Outline
        fr: Contour
        files: [Presets/Chips/Outline.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Hidden
        en: Hidden
        fr: Masquées
        constants:
          HeroStyleShowInfoLine: False

  - group: TopPanel
    en: Top panel
    fr: Barre du haut
    restart: True
    options:
      - id: Default
        en: Neon (everything on the left)
        fr: Neon (tout à gauche)
      - id: Dune
        en: Dune (view buttons centered, transparent)
        fr: Dune (boutons de vue centrés, transparente)
        files: [Presets/TopPanel/Dune.xaml]

  - group: Accent
    en: Accent color
    fr: Couleur d'accent
    restart: True
    options:
      - id: Default
        en: Color of the color profile (Neon blue by default)
        fr: Couleur du profil de couleurs (bleu Neon par défaut)
      - id: Amber
        en: Dune amber
        fr: Ambre Dune
        constants: {GlyphColor: "#FFB547", GlyphSubColor: "#FF9F1C", HighlightGlyphColor: "#88FFC870", HoverColor: "#B7791F"}
      - id: Violet
        en: Violet
        fr: Violet
        constants: {GlyphColor: "#A78BFA", GlyphSubColor: "#8B5CF6", HighlightGlyphColor: "#88C4B5FD", HoverColor: "#6D28D9"}
      - id: Emerald
        en: Emerald
        fr: Émeraude
        constants: {GlyphColor: "#34D399", GlyphSubColor: "#10B981", HighlightGlyphColor: "#886EE7B7", HoverColor: "#047857"}
      - id: Crimson
        en: Crimson
        fr: Cramoisi
        constants: {GlyphColor: "#F87171", GlyphSubColor: "#EF4444", HighlightGlyphColor: "#88FCA5A5", HoverColor: "#B91C1C"}
      - id: Pink
        en: Pink
        fr: Rose
        constants: {GlyphColor: "#F472B6", GlyphSubColor: "#EC4899", HighlightGlyphColor: "#88F9A8D4", HoverColor: "#BE185D"}
      - id: Cyan
        en: Cyan
        fr: Cyan
        constants: {GlyphColor: "#22D3EE", GlyphSubColor: "#06B6D4", HighlightGlyphColor: "#8867E8F9", HoverColor: "#0E7490"}
      - id: Gold
        en: Gold
        fr: Or
        constants: {GlyphColor: "#FACC15", GlyphSubColor: "#EAB308", HighlightGlyphColor: "#88FDE047", HoverColor: "#A16207"}
      - id: Linkin
        en: Hybrid red (Linkin Park)
        fr: Rouge Hybrid (Linkin Park)
        constants: {GlyphColor: "#E63946", GlyphSubColor: "#C1121F", HighlightGlyphColor: "#88FF6B6B", HoverColor: "#780000"}

  - group: Animations
    en: Animations
    fr: Animations
    options:
      - id: Default
        en: Smooth
        fr: Douces
      - id: Fast
        en: Fast
        fr: Rapides
        files: [Presets/Animations/Fast.xaml]
      - id: "Off"
        en: Off
        fr: Désactivées
        files: [Presets/Animations/Off.xaml]

  - group: HeroBackground
    en: Artwork sharpness
    fr: Netteté de l'image
    options:
      - id: Default
        en: Sharp
        fr: Nette
      - id: Soft
        en: Soft blur
        fr: Flou léger
        files: [Presets/Background/SoftBlur.xaml]
      - id: Strong
        en: Strong blur
        fr: Flou fort
        files: [Presets/Background/StrongBlur.xaml]

  - group: BackgroundVertical
    en: Artwork vertical position
    fr: Position verticale de l'image
    options:
      - id: Default
        en: Center
        fr: Centre
      - id: Top
        en: Top
        fr: Haut
        files: [Presets/Background/AlignTop.xaml]
      - id: Bottom
        en: Bottom
        fr: Bas
        files: [Presets/Background/AlignBottom.xaml]

  - group: BackgroundHorizontal
    en: Artwork horizontal position
    fr: Position horizontale de l'image
    options:
      - id: Default
        en: Left
        fr: Gauche
      - id: Center
        en: Center
        fr: Centre
        files: [Presets/Background/AlignCenter.xaml]
      - id: Right
        en: Right
        fr: Droite
        files: [Presets/Background/AlignRight.xaml]

  - group: HeaderBar
    en: Tiles under the card (look)
    fr: Tuiles sous la carte (apparence)
    options:
      - id: Default
        en: Glass tiles
        fr: Tuiles en verre
      - id: Large
        en: Large glass tiles
        fr: Grandes tuiles en verre
        constants: {HeaderTilePadding: '20,14,20,14', HeaderTileMargin: '0,0,14,0', HeaderTileValueFontSize: 20, HeaderRowPadding: '0,16,0,20'}
      - id: Compact
        en: Compact glass tiles
        fr: Tuiles en verre compactes
        constants: {HeaderTilePadding: '12,7,12,7', HeaderTileMargin: '0,0,8,0', HeaderTileValueFontSize: 14, HeaderRowPadding: '0,10,0,14'}
      - id: TextOnly
        en: Text only (no boxes)
        fr: Texte seul (sans cases)
        constants: {HeaderTileBackgroundOpacity: 0, HeaderTilePadding: '0,4,0,4', HeaderTileMargin: '0,0,28,0'}
      - id: Bar
        en: Frosted bar across the page (Neon)
        fr: Barre en verre dépoli sur toute la largeur (Neon)
        constants: &plain_bar {HeaderBarBlurOpacity: 1, HeaderBarGlassOpacity: 1, HeaderRowBackgroundOpacity: 1, HeaderRowPadding: '20,10,30,10',
                               HeaderTileBackgroundOpacity: 0, HeaderTilePadding: 0, HeaderTileMargin: '20,0,0,0', HeaderBarStyleVisible: True}
      - id: SolidBar
        en: Solid bar across the page
        fr: Barre opaque sur toute la largeur
        constants: {<<: *plain_bar, HeaderBarBlurOpacity: 0}
      - id: Hidden
        en: Hidden
        fr: Masquées
        constants: {HeaderBarStyleVisible: False}

# Schema shown in the help tooltip of a setting (Presets/Previews/<name>.png)
tip_images:
  HeroCoverWidth: HeroCover_Default
  HeroCoverHeight: HeroCover_Inside
  HeroShowInfoLine: Chips_Default
  HeroInfoLineMaxWidth: Chips_Default
  HeroActionButtonWidth: Buttons_Default
  HeroActionButtonHeight: Buttons_Default
  DetailsViewShowHeaderBar: HeaderBar_Default
  HeaderButtonSize: HeaderBar_Bar
  HltbShowOnCover: HeroCover_Hidden
  AchievementsShowOnCover: HeroCover_Hidden
  DetailsViewShowInfoPanelDefault: HeroCover_InsideKeepPanel

# Header tiles: twelve slots under the artwork card, each one a Theme Options list of every
# information type below (tools/header_tiles.py writes the tiles into the Details view and the lists).
# A value is stored by the presets, never renumber. Constants.xaml HeaderTileSlot<n> = default of slot n.
# Previews: Presets/Previews/Tile_<id>.png (tools/make_previews.py, from the example and needs fields).
header_tiles:
  insert_after: HeaderBar
  group: {en: 'Tile {n} (from the left)', fr: 'Tuile {n} (en partant de la gauche)'}
  default: {en: 'Default: {type}', fr: 'Par défaut : {type}'}
  slots: [PlayTime, LastPlayed, CompletionStatus, Achievements, HltbMain, Scores, InstallSize, AvgFps, Empty, Empty, Empty, Empty]
  types:
    - {id: Empty, value: 0, en: Empty, fr: Vide}
    - {id: PlayTime, value: 1, en: Time played, fr: Temps de jeu, example: 1h 51m}
    - {id: LastPlayed, value: 2, en: Last played, fr: Dernière partie, example: 10/10/2026}
    - {id: CompletionStatus, value: 3, en: Completion status (editable with ThemeExtras), fr: Statut de complétion (modifiable avec ThemeExtras), example: Playing}
    - {id: Achievements, value: 4, en: 'Achievements: count and bar', fr: 'Succès : nombre et barre', example: 12 / 40, needs: PlayniteAchievements}
    - {id: AchievementsPercent, value: 28, en: 'Achievements: percentage', fr: 'Succès : pourcentage', example: 30 %, needs: PlayniteAchievements}
    - {id: LatestAchievement, value: 29, en: Latest unlocked achievement, fr: Dernier succès débloqué, example: Kingdom built, needs: PlayniteAchievements}
    - {id: RareAchievements, value: 30, en: Rare and ultra rare achievements, fr: Succès rares et ultra rares, example: 3/10 · 1/4, needs: PlayniteAchievements}
    - {id: HltbMain, value: 5, en: 'HowLongToBeat: main story', fr: 'HowLongToBeat : histoire', example: 20h, needs: HowLongToBeat}
    - {id: HltbMainExtra, value: 25, en: 'HowLongToBeat: main + extra', fr: 'HowLongToBeat : histoire + extras', example: 27h, needs: HowLongToBeat}
    - {id: HltbCompletionist, value: 26, en: 'HowLongToBeat: 100%', fr: 'HowLongToBeat : 100 %', example: 57h, needs: HowLongToBeat}
    - {id: HltbAll, value: 27, en: 'HowLongToBeat: all three times', fr: 'HowLongToBeat : les trois durées', example: 20h · 27h · 57h, needs: HowLongToBeat}
    - {id: Scores, value: 6, en: Critic and community scores, fr: Notes des critiques et de la communauté, example: 89 · 80}
    - {id: CriticScore, value: 23, en: Critic score, fr: Note des critiques, example: '89'}
    - {id: CommunityScore, value: 24, en: Community score, fr: Note de la communauté, example: '80'}
    - {id: UserScore, value: 22, en: Your score, fr: Votre note, example: '95'}
    - {id: InstallSize, value: 7, en: Install size, fr: Taille installée, example: 2.27 GB}
    - {id: AvgFps, value: 8, en: Average FPS, fr: FPS moyen, example: '60', needs: GameActivity}
    - {id: LastSession, value: 9, en: Last session length, fr: Durée de la dernière session, example: 1h 12m, needs: GameActivity}
    - {id: RecentActivity, value: 10, en: Recent activity, fr: Activité récente, example: 3h 40m (14 days), needs: GameActivity}
