variables:
  - header: PanelNote
    en: '— Below: settings of the theme panel (top panel button, section gears). Change them there —'
    fr: '— Ci-dessous : réglages du panneau du thème (bouton de la barre du haut, engrenages). Réglez-les plutôt là-bas —'
  - header: TopPanel
    en: Top panel and sidebar
    fr: Barre du haut et barre latérale
  - {key: ShowNavigationButtons, en: Show navigation buttons, fr: Afficher les boutons de navigation}
  - {key: TopPanelShowCollectorLevel, en: Collection level badge (PlayniteAchievements), fr: Badge de niveau de collection (PlayniteAchievements)}
  - {key: TopPanelAutoHide, en: Hide the top panel until the mouse comes over it, fr: Masquer la barre du haut jusqu'au passage de la souris}
  - {key: SettingsPanelWidth, range: [700, 1400], en: Settings panel width, fr: Largeur du panneau de réglages}
  - {key: SettingsPanelHeight, range: [500, 1000], en: Settings panel height, fr: Hauteur du panneau de réglages}
  - {key: SidebarAutoHide, en: Hide the sidebar until the mouse comes over it, fr: Masquer la barre latérale jusqu'au passage de la souris}
  - {key: TopPanelSearchBoxWidthHelium, range: [80, 600], en: Search box width, fr: Largeur de la recherche}
  - {key: TopPanelHeight, range: [36, 100], en: Top panel height, fr: Hauteur de la barre du haut}
  - {key: SidebarItemSize, range: [24, 64], en: Sidebar icon size, fr: Taille des icônes de la barre latérale}

  - header: Hero
