  strings:
    LOCHNDPanelChipOrder:
      en: Chips, in their order
      fr: Puces, dans leur ordre
    LOCHNDPanelChipOrderText:
      en: Arrows on the left move a chip, the switch shows it, the button on the right starts a new line before it. The preview and the artwork follow at once.
      fr: Les flèches à gauche déplacent une puce, l'interrupteur l'affiche, le bouton à droite fait un retour à la ligne avant elle. L'aperçu et l'illustration suivent aussitôt.
    LOCHNDPanelRestart:
      en: after restart
      fr: au redémarrage
    LOCHNDPanelRestartTip:
      en: Playnite reads this setting when it starts.
      fr: Playnite lit ce réglage au démarrage.
    LOCHNDPanelTextSection:
      en: Section title
      fr: Titre de section
    LOCHNDPanelTextLarge:
      en: Large text, game name in lists
      fr: Grand texte, nom du jeu dans les listes
    LOCHNDPanelTextNormal:
      en: Normal text, descriptions and values
      fr: Texte normal, descriptions et valeurs
    LOCHNDPanelTextSmall:
      en: Small text, notes and captions
      fr: Petit texte, notes et légendes
    LOCHNDPanelShow:
      en: Show
      fr: Afficher
    LOCHNDPanelHide:
      en: Hide
      fr: Masquer
    LOCHNDPanelMoveUp:
      en: Move before the previous chip
      fr: Placer avant la puce précédente
    LOCHNDPanelMoveDown:
      en: Move after the next chip
      fr: Placer après la puce suivante
    LOCHNDPanelPreview:
      en: Preview (live)
      fr: Aperçu (en direct)
    LOCHNDPanelBreakTip:
      en: New line before this chip
      fr: Retour à la ligne avant cette puce
    LOCHNDPanelColorsText:
      en: The color profile, the accent and the look of this panel (profile colors, dark, glass) are drop-down lists in the Theme Options settings
        and need a restart. ThemeModifier edits single colors, and its saved colors win over the profile.
      fr: Le profil de couleurs, l'accent et l'aspect de ce panneau (couleurs du profil, sombre, verre) sont des menus déroulants dans les réglages
        de Theme Options et demandent un redémarrage. ThemeModifier modifie les couleurs une par une, et ses couleurs enregistrées passent avant
        le profil.
    LOCHNDPanelSections:
      en: Sections
      fr: Sections
    LOCHNDPanelClose:
      en: Close
      fr: Fermer
