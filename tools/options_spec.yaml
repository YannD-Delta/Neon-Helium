presets:
  - group: Style
    en: Global style
    fr: Style global
    options:
      - id: Default
        en: Helium-Neon-Dune (Dune header, Neon information)
        fr: Helium-Neon-Dune (en-tête Dune, infos Neon)
      - id: Neon
        en: Neon classic (buttons in the header bar)
        fr: Neon classique (boutons dans la barre)
        files: [Presets/Buttons/Neon.xaml]
        constants:
          HeroActionsLocation: 1
          HeroStyleShowInfoLine: False
          HeroShadeOpacity: 0.25
      - id: Dune
        en: Dune (large artwork, text chips, clear header bar)
        fr: Dune (grande image, infos en texte, barre transparente)
        files: [Presets/Chips/Text.xaml]
        constants:
          HeroShadeOpacity: 0.85
          HeaderBarBlurOpacity: 0
          HeaderBarGlassOpacity: 0
      - id: Minimal
        en: Minimal (no chips, no header bar)
        fr: Minimal (sans puces ni barre)
        constants:
          HeroStyleShowInfoLine: False
          HeaderBarStyleVisible: False
          HeroShadeOpacity: 0.5

  - group: Buttons
    en: Play button style
    fr: Style du bouton Jouer
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Dune
        en: Dune (flat, rounded)
        fr: Dune (plat, arrondi)
        files: [Presets/Buttons/Dune.xaml]
      - id: Neon
        en: Neon (gradient, small caps)
        fr: Neon (dégradé, petites capitales)
        files: [Presets/Buttons/Neon.xaml]
      - id: Pill
        en: Pill (fully rounded)
        fr: Pilule (entièrement arrondi)
        files: [Presets/Buttons/Pill.xaml]
      - id: Glass
        en: Glass (outline, accent color)
        fr: Verre (contour, couleur d'accent)
        files: [Presets/Buttons/Glass.xaml]

  - group: ActionsLocation
    en: Play, edit and favorite buttons
    fr: Boutons Jouer, Modifier et Favori
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Hero
        en: In the artwork (Dune)
        fr: Dans l'image (Dune)
        constants:
          HeroActionsLocation: 0
      - id: HeaderBar
        en: In the header bar (Neon)
        fr: Dans la barre d'en-tête (Neon)
        constants:
          HeroActionsLocation: 1

  - group: Chips
    en: Information chips in the artwork
    fr: Puces d'information dans l'image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Pills
        en: Pills
        fr: Pastilles
        files: [Presets/Chips/Pills.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Text
        en: Plain text (Dune)
        fr: Texte simple (Dune)
        files: [Presets/Chips/Text.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Outline
        en: Outline
        fr: Contour
        files: [Presets/Chips/Outline.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Hidden
        en: Hidden
        fr: Masquées
        constants:
          HeroStyleShowInfoLine: False

  - group: TopPanel
    en: Top panel
    fr: Barre du haut
    restart: True
    options:
      - id: Default
        en: Neon (everything on the left)
        fr: Neon (tout à gauche)
      - id: Dune
        en: Dune (view buttons centered, transparent)
        fr: Dune (boutons de vue centrés, transparente)
        files: [Presets/TopPanel/Dune.xaml]

  - group: Accent
    en: Accent color
    fr: Couleur d'accent
    restart: True
    options:
      - id: Default
        en: Color of the color profile (Neon blue by default)
        fr: Couleur du profil de couleurs (bleu Neon par défaut)
      - id: Amber
        en: Dune amber
        fr: Ambre Dune
        constants: {GlyphColor: "#FFB547", GlyphSubColor: "#FF9F1C", HighlightGlyphColor: "#88FFC870", HoverColor: "#B7791F"}
      - id: Violet
        en: Violet
        fr: Violet
        constants: {GlyphColor: "#A78BFA", GlyphSubColor: "#8B5CF6", HighlightGlyphColor: "#88C4B5FD", HoverColor: "#6D28D9"}
      - id: Emerald
        en: Emerald
        fr: Émeraude
        constants: {GlyphColor: "#34D399", GlyphSubColor: "#10B981", HighlightGlyphColor: "#886EE7B7", HoverColor: "#047857"}
      - id: Crimson
        en: Crimson
        fr: Cramoisi
        constants: {GlyphColor: "#F87171", GlyphSubColor: "#EF4444", HighlightGlyphColor: "#88FCA5A5", HoverColor: "#B91C1C"}
      - id: Pink
        en: Pink
        fr: Rose
        constants: {GlyphColor: "#F472B6", GlyphSubColor: "#EC4899", HighlightGlyphColor: "#88F9A8D4", HoverColor: "#BE185D"}
      - id: Cyan
        en: Cyan
        fr: Cyan
        constants: {GlyphColor: "#22D3EE", GlyphSubColor: "#06B6D4", HighlightGlyphColor: "#8867E8F9", HoverColor: "#0E7490"}
      - id: Gold
        en: Gold
        fr: Or
        constants: {GlyphColor: "#FACC15", GlyphSubColor: "#EAB308", HighlightGlyphColor: "#88FDE047", HoverColor: "#A16207"}
      - id: Linkin
        en: Hybrid red (Linkin Park)
        fr: Rouge Hybrid (Linkin Park)
        constants: {GlyphColor: "#E63946", GlyphSubColor: "#C1121F", HighlightGlyphColor: "#88FF6B6B", HoverColor: "#780000"}

  - group: PanelLook
    en: Settings panel look
    fr: Aspect du panneau de réglages
    restart: True
    options:
      - id: Default
        en: Colors of the color profile
        fr: Couleurs du profil
      - id: Dark
        en: Dark
        fr: Sombre
        constants: {SettingsPanelProfileOpacity: 0, SettingsPanelOverlayBrush: "#F20D1014"}
      - id: Glass
        en: Glass (see-through)
        fr: Verre (transparent)
        constants: {SettingsPanelProfileOpacity: 0.72, SettingsPanelOverlayBrush: "#33000000", SettingsPanelCornerRadius: 16}

  - group: Animations
    en: Animations
    fr: Animations
    options:
      - id: Default
        en: Smooth
        fr: Douces
      - id: Fast
        en: Fast
        fr: Rapides
        files: [Presets/Animations/Fast.xaml]
      - id: "Off"
        en: Off
        fr: Désactivées
        files: [Presets/Animations/Off.xaml]

  - group: HeroShade
    en: Shade over the artwork
    fr: Voile sur l'image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: None
        en: None
        fr: Aucun
        constants: {HeroShadeOpacity: 0}
      - id: Light
        en: Light
        fr: Léger
        constants: {HeroShadeOpacity: 0.35}
      - id: Medium
        en: Medium
        fr: Moyen
        constants: {HeroShadeOpacity: 0.65}
      - id: Strong
        en: Strong
        fr: Fort
        constants: {HeroShadeOpacity: 0.85}

  - group: HeroBackground
    en: Artwork sharpness
    fr: Netteté de l'image
    options:
      - id: Default
        en: Sharp
        fr: Nette
      - id: Soft
        en: Soft blur
        fr: Flou léger
        files: [Presets/Background/SoftBlur.xaml]
      - id: Strong
        en: Strong blur
        fr: Flou fort
        files: [Presets/Background/StrongBlur.xaml]

  - group: BackgroundVertical
    en: Artwork vertical position
    fr: Position verticale de l'image
    options:
      - id: Default
        en: Center
        fr: Centre
      - id: Top
        en: Top
        fr: Haut
        files: [Presets/Background/AlignTop.xaml]
      - id: Bottom
        en: Bottom
        fr: Bas
        files: [Presets/Background/AlignBottom.xaml]

  - group: BackgroundHorizontal
    en: Artwork horizontal position
    fr: Position horizontale de l'image
    options:
      - id: Default
        en: Left
        fr: Gauche
      - id: Center
        en: Center
        fr: Centre
        files: [Presets/Background/AlignCenter.xaml]
      - id: Right
        en: Right
        fr: Droite
        files: [Presets/Background/AlignRight.xaml]

  - group: HeaderBar
    en: Header bar (time played, last played...)
    fr: Barre d'en-tête (temps de jeu, dernière partie...)
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Glass
        en: Frosted glass
        fr: Verre dépoli
        constants: {HeaderBarBlurOpacity: 1, HeaderBarGlassOpacity: 1, HeaderBarStyleVisible: True}
      - id: Solid
        en: Solid
        fr: Opaque
        constants: {HeaderBarBlurOpacity: 0, HeaderBarGlassOpacity: 1, HeaderBarStyleVisible: True}
      - id: Transparent
        en: Transparent
        fr: Transparente
        constants: {HeaderBarBlurOpacity: 0, HeaderBarGlassOpacity: 0, HeaderBarStyleVisible: True}
      - id: Hidden
        en: Hidden
        fr: Masquée
        constants: {HeaderBarStyleVisible: False}

  - group: BackgroundBlur
    en: Blurred background behind the information
    fr: Fond flouté derrière les informations
    options:
      - id: Default
        en: Normal
        fr: Normal
      - id: "Off"
        en: Off
        fr: Désactivé
        constants: {DetailsViewBackgroundBlurOpacity: 0, GridViewBackgroundBlurOpacity: 0}
      - id: Light
        en: Light
        fr: Léger
        constants: {DetailsViewBackgroundBlurOpacity: 0.15, GridViewBackgroundBlurOpacity: 0.15}
      - id: Strong
        en: Strong
        fr: Fort
        constants: {DetailsViewBackgroundBlurOpacity: 0.5, GridViewBackgroundBlurOpacity: 0.5}


# Color profiles: complete palettes. tools/color_profiles.py derives every color of Constants.xaml
# from the 13 base colors and build_options.py writes Presets/Colors/<id>.xaml plus the
# "Color profile" drop-down (placed before the Accent list, which can still override the accent).
# Base colors: bg_deep (window edges, lists), bg (window center), panel (top panel, popups),
# control (inputs, cards), text, text_dim, accent, accent2 (install button, gradients), play,
# positive / mixed / negative (ratings), orange (unsaved changes marker).
# The theme draws white text over artwork and buttons, so every profile is dark.
color_profiles:
  group: {en: Color profile, fr: Profil de couleurs}
  insert_before: Accent
  default: {en: Neon (theme colors), fr: Neon (couleurs du thème)}
  profiles:
    - id: DuneSand
      en: Dune sand (amber on warm brown)
      fr: Sable de Dune (ambre sur brun chaud)
      palette: {bg_deep: "#120E0A", bg: "#2A2118", panel: "#1A1510", control: "#3A2F24", text: "#EDE3D3", text_dim: "#A8988A",
                accent: "#FFB547", accent2: "#E8912D", play: "#D98E2B", positive: "#A8C77A", mixed: "#F2D16B", negative: "#E06C5A", orange: "#FF9F1C"}
    - id: HybridRed
      en: Hybrid red (red on charcoal)
      fr: Rouge Hybrid (rouge sur anthracite)
      palette: {bg_deep: "#0B0B0C", bg: "#232325", panel: "#141415", control: "#2E2E31", text: "#ECECEC", text_dim: "#9C9C9F",
                accent: "#E63946", accent2: "#C1121F", play: "#C1121F", positive: "#7FD48A", mixed: "#F4D35E", negative: "#FF5A5F", orange: "#F08A4B"}
    - id: OledBlack
