# Single source of truth for the theme settings.
#
# python tools/build_options.py writes from this file:
#   source/options.yaml              ThemeOptions presets (drop-down lists) and variables
#   source/Localization/fr_FR.xaml   French labels (ThemeOptions loads them when Playnite is in French)
#   source/thememodifier.yaml        ThemeModifier color pickers
#   source/Presets/**/*.xaml         preset resource files, and the default hero styles in
#                                    source/DerivedStyles/PlayButton.xaml (templates in build_options.py)
#
# Types and default values are read from source/Constants.xaml, so they cannot drift.
# Preset constants must not be variables: Theme Options saves every current value on exit,
# so a value set by a preset would come back as a user setting and stay after the preset changes.
# Presets use their own keys (HeroStyleShowInfoLine...), combined with the variables in the views.
#
# Ranges become ThemeOptions sliders. Only whole-number steps are used: ThemeOptions stores
# slider values as text and a decimal comma would break the generated resources.

strings:
  LOCHNDThemeSettingsTooltip: {en: 'Theme settings (Theme Options)', fr: 'Réglages du thème (Theme Options)'}
  LOCHNDChipAchievements: {en: Achievements, fr: Succès}
  LOCHNDChipScore: {en: Score, fr: Note}
  LOCHNDChipHltbMain: {en: Main, fr: Histoire}
  LOCHNDChipHltbExtra: {en: Main + Extra, fr: Histoire + extras}
  LOCHNDChipHltbCompletionist: {en: "100%", fr: "100 %"}
  LOCHNDChipLastSession: {en: Last session, fr: Dernière session}
  LOCHNDChipAvgFps: {en: Avg FPS, fr: FPS moy.}
  LOCHNDTileScores: {en: 'Critics · Community', fr: 'Critiques · Communauté'}
  LOCHNDFavoriteButtonTooltip: {en: Favorite (ThemeExtras), fr: Favori (ThemeExtras)}
  LOCHNDHiddenButtonTooltip: {en: Hidden game (ThemeExtras), fr: Jeu masqué (ThemeExtras)}
  LOCHNDCollectorTooltip: {en: Collection level (PlayniteAchievements), fr: Niveau de collection (PlayniteAchievements)}
  LOCHNDCollectorLevel: {en: Lv., fr: Niv.}
  LOCHNDTabAll: {en: 'All', fr: 'Tout'}
  LOCHNDTabAbout: {en: 'About', fr: 'Infos'}
  LOCHNDTabMedia: {en: 'Media', fr: 'Médias'}
  LOCHNDTabStats: {en: 'Stats', fr: 'Stats'}
  LOCHNDTabCommunity: {en: 'Community', fr: 'Communauté'}
  LOCHNDChipLatestAchievement: {en: Latest, fr: Dernier succès}
  LOCHNDChipRare: {en: Rare, fr: Rares}
  LOCHNDChipUltraRare: {en: Ultra rare, fr: Ultra rares}
  LOCHNDSectionScreenshotUtilities: {en: Screenshots, fr: Captures d'écran}

presets:
  - group: Style
    en: Global style
    fr: Style global
    options:
      - id: Default
        en: Helium-Neon-Dune 2.7 (rounded card, progressive blur, cover, tiles)
        fr: Helium-Neon-Dune 2.7 (carte arrondie, flou progressif, jaquette, tuiles)
      - id: Dune
        en: Dune (rounded card, text chips, taller and stronger blur)
        fr: Dune (carte arrondie, infos en texte, flou plus haut et plus fort)
        files: [Presets/Chips/Text.xaml]
        constants:
          HeroShadeOpacity: 0.5
          HeroBlurRadiusSoft: 14
          HeroBlurRadius: 48
          HeroBlurStart: 0.3
          HeroBlurMid: 0.5
          HeroBlurFull: 0.8
      - id: Classic
        en: Helium-Neon-Dune 2.5 (full-width artwork, frosted header bar)
        fr: Helium-Neon-Dune 2.5 (image pleine largeur, barre en verre dépoli)
        constants: &classic_look
          HeroCardMargin: 0
          HeroCardCornerRadius: 0
          HeroCardBorderThickness: 0
          HeroFadeStart: 0.75
          HeroBlurOpacity: 0
          HeroTintAccentOpacity: 0
          HeroTintLightOpacity: 0
          HeroCoverPlacement: 2
          InfoPanelStyleShowCover: True
          HeroShadeOpacity: 0.65
          HeroActionsLocation: 0
          HeaderBarBlurOpacity: 1
          HeaderBarGlassOpacity: 1
          HeaderRowBackgroundOpacity: 1
          HeaderRowPadding: 20,10,30,10
          HeaderTileBackgroundOpacity: 0
          HeaderTileCornerRadius: 0
          HeaderTilePadding: 0
          HeaderTileMargin: 20,0,0,0
      - id: Neon
        en: Neon classic (full width, buttons in the header bar)
        fr: Neon classique (pleine largeur, boutons dans la barre)
        files: [Presets/Buttons/Neon.xaml]
        constants:
          <<: *classic_look
          HeroActionsLocation: 1
          HeroStyleShowInfoLine: False
          HeroShadeOpacity: 0.25
      - id: DuneClassic
        en: Dune 2.5 (full width, large artwork, text chips, clear header bar)
        fr: Dune 2.5 (pleine largeur, grande image, infos en texte, barre transparente)
        files: [Presets/Chips/Text.xaml]
        constants:
          <<: *classic_look
          HeroShadeOpacity: 0.85
          HeaderBarBlurOpacity: 0
          HeaderBarGlassOpacity: 0
      - id: Minimal
        en: Minimal (card without chips or tiles)
        fr: Minimal (carte sans puces ni tuiles)
        constants:
          HeroStyleShowInfoLine: False
          HeaderBarStyleVisible: False
          HeroShadeOpacity: 0.5

  - group: HeroCard
    en: Artwork header shape
    fr: Forme de l'en-tête avec image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Card
        en: Rounded card (20 px corners)
        fr: Carte arrondie (coins de 20 px)
        constants: {HeroCardMargin: '20,16,20,0', HeroCardCornerRadius: 20, HeroCardBorderThickness: 1, HeroFadeStart: 1}
      - id: Soft
        en: Very rounded card, wide spacing (32 px)
        fr: Carte très arrondie, espacée (32 px)
        constants: {HeroCardMargin: '40,24,40,0', HeroCardCornerRadius: 32, HeroCardBorderThickness: 1, HeroFadeStart: 1}
      - id: Tight
        en: Slightly rounded card, close to the edges (10 px)
        fr: Carte peu arrondie, près des bords (10 px)
        constants: {HeroCardMargin: '8,8,8,0', HeroCardCornerRadius: 10, HeroCardBorderThickness: 1, HeroFadeStart: 1}
      - id: Frameless
        en: Rounded card without outline
        fr: Carte arrondie sans contour
        constants: {HeroCardMargin: '20,16,20,0', HeroCardCornerRadius: 20, HeroCardBorderThickness: 0, HeroFadeStart: 1}
      - id: FullWidth
        en: Full width, fading into the page (2.5)
        fr: Pleine largeur, fondu dans la page (2.5)
        constants: {HeroCardMargin: 0, HeroCardCornerRadius: 0, HeroCardBorderThickness: 0, HeroFadeStart: 0.75}

  - group: HeroBlur
    en: Progressive blur at the bottom of the artwork
    fr: Flou progressif en bas de l'image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: "Off"
        en: Off (sharp artwork)
        fr: Désactivé (image nette)
        constants: {HeroBlurOpacity: 0}
      - id: Light
        en: Light
        fr: Léger
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 4, HeroBlurRadius: 14}
      - id: Medium
        en: Medium
        fr: Moyen
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 8, HeroBlurRadius: 28}
      - id: Strong
        en: Strong
        fr: Fort
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 14, HeroBlurRadius: 48}
      - id: Extreme
        en: Very strong (frosted glass)
        fr: Très fort (verre dépoli)
        constants: {HeroBlurOpacity: 1, HeroBlurRadiusSoft: 24, HeroBlurRadius: 80}

  - group: HeroBlurHeight
    en: Height of the blurred band
    fr: Hauteur de la bande floutée
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Small
        en: Small (bottom quarter)
        fr: Petite (quart du bas)
        constants: {HeroBlurStart: 0.6, HeroBlurMid: 0.75, HeroBlurFull: 0.92}
      - id: Medium
        en: Medium (bottom half)
        fr: Moyenne (moitié du bas)
        constants: {HeroBlurStart: 0.45, HeroBlurMid: 0.65, HeroBlurFull: 0.9}
      - id: Large
        en: Large (two thirds)
        fr: Grande (deux tiers)
        constants: {HeroBlurStart: 0.3, HeroBlurMid: 0.5, HeroBlurFull: 0.8}
      - id: Full
        en: Whole artwork, blurrier towards the bottom
        fr: Toute l'image, de plus en plus floue vers le bas
        constants: {HeroBlurStart: 0, HeroBlurMid: 0.35, HeroBlurFull: 0.7}

  - group: HeroTint
    en: Color over the blurred band
    fr: Couleur sur la bande floutée
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: None
        en: None (artwork colors)
        fr: Aucune (couleurs de l'image)
        constants: {HeroTintAccentOpacity: 0, HeroTintLightOpacity: 0}
      - id: Accent
        en: Accent color, light
        fr: Couleur d'accent, légère
        constants: {HeroTintAccentOpacity: 0.3, HeroTintLightOpacity: 0}
      - id: AccentStrong
        en: Accent color, strong
        fr: Couleur d'accent, forte
        constants: {HeroTintAccentOpacity: 0.55, HeroTintLightOpacity: 0}
      - id: Frost
        en: White frost
        fr: Givre blanc
        constants: {HeroTintAccentOpacity: 0, HeroTintLightOpacity: 0.12}
      - id: AccentFrost
        en: Accent color and frost
        fr: Couleur d'accent et givre
        constants: {HeroTintAccentOpacity: 0.25, HeroTintLightOpacity: 0.08}

  - group: HeroCover
    en: Cover in the artwork header
    fr: Jaquette dans l'en-tête
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Overlap
        en: Over the card edge and the tiles
        fr: À cheval sur la carte et les tuiles
        constants: {HeroCoverPlacement: 0, InfoPanelStyleShowCover: False}
      - id: Inside
        en: Inside the card
        fr: Dans la carte
        constants: {HeroCoverPlacement: 1, InfoPanelStyleShowCover: False}
      - id: InsideKeepPanel
        en: Inside the card, also in the information panel
        fr: Dans la carte, et aussi dans le panneau d'informations
        constants: {HeroCoverPlacement: 1, InfoPanelStyleShowCover: True}
      - id: Hidden
        en: Hidden (cover in the information panel only)
        fr: Masquée (jaquette dans le panneau d'informations seulement)
        constants: {HeroCoverPlacement: 2, InfoPanelStyleShowCover: True}

  - group: Buttons
    en: Play button style
    fr: Style du bouton Jouer
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Dune
        en: Dune (flat, rounded)
        fr: Dune (plat, arrondi)
        files: [Presets/Buttons/Dune.xaml]
      - id: Neon
        en: Neon (gradient, small caps)
        fr: Neon (dégradé, petites capitales)
        files: [Presets/Buttons/Neon.xaml]
      - id: Pill
        en: Pill (fully rounded)
        fr: Pilule (entièrement arrondi)
        files: [Presets/Buttons/Pill.xaml]
      - id: Glass
        en: Glass (outline, accent color)
        fr: Verre (contour, couleur d'accent)
        files: [Presets/Buttons/Glass.xaml]

  - group: ActionsLocation
    en: Play, edit and favorite buttons
    fr: Boutons Jouer, Modifier et Favori
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: HeroRight
        en: In the artwork, at the right of the information
        fr: Dans l'image, à droite des informations
        constants:
          HeroActionsLocation: 2
      - id: Hero
        en: In the artwork, under the chips (Dune)
        fr: Dans l'image, sous les puces (Dune)
        constants:
          HeroActionsLocation: 0
      - id: HeaderBar
        en: In the header bar (Neon)
        fr: Dans la barre d'en-tête (Neon)
        constants:
          HeroActionsLocation: 1

  - group: Chips
    en: Information chips in the artwork
    fr: Puces d'information dans l'image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Pills
        en: Pills
        fr: Pastilles
        files: [Presets/Chips/Pills.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Text
        en: Plain text (Dune)
        fr: Texte simple (Dune)
        files: [Presets/Chips/Text.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Outline
        en: Outline
        fr: Contour
        files: [Presets/Chips/Outline.xaml]
        constants:
          HeroStyleShowInfoLine: True
      - id: Hidden
        en: Hidden
        fr: Masquées
        constants:
          HeroStyleShowInfoLine: False

  - group: TopPanel
    en: Top panel
    fr: Barre du haut
    restart: True
    options:
      - id: Default
        en: Neon (everything on the left)
        fr: Neon (tout à gauche)
      - id: Dune
        en: Dune (view buttons centered, transparent)
        fr: Dune (boutons de vue centrés, transparente)
        files: [Presets/TopPanel/Dune.xaml]

  - group: Accent
    en: Accent color
    fr: Couleur d'accent
    restart: True
    options:
      - id: Default
        en: Color of the color profile (Neon blue by default)
        fr: Couleur du profil de couleurs (bleu Neon par défaut)
      - id: Amber
        en: Dune amber
        fr: Ambre Dune
        constants: {GlyphColor: "#FFB547", GlyphSubColor: "#FF9F1C", HighlightGlyphColor: "#88FFC870", HoverColor: "#B7791F"}
      - id: Violet
        en: Violet
        fr: Violet
        constants: {GlyphColor: "#A78BFA", GlyphSubColor: "#8B5CF6", HighlightGlyphColor: "#88C4B5FD", HoverColor: "#6D28D9"}
      - id: Emerald
        en: Emerald
        fr: Émeraude
        constants: {GlyphColor: "#34D399", GlyphSubColor: "#10B981", HighlightGlyphColor: "#886EE7B7", HoverColor: "#047857"}
      - id: Crimson
        en: Crimson
        fr: Cramoisi
        constants: {GlyphColor: "#F87171", GlyphSubColor: "#EF4444", HighlightGlyphColor: "#88FCA5A5", HoverColor: "#B91C1C"}
      - id: Pink
        en: Pink
        fr: Rose
        constants: {GlyphColor: "#F472B6", GlyphSubColor: "#EC4899", HighlightGlyphColor: "#88F9A8D4", HoverColor: "#BE185D"}
      - id: Cyan
        en: Cyan
        fr: Cyan
        constants: {GlyphColor: "#22D3EE", GlyphSubColor: "#06B6D4", HighlightGlyphColor: "#8867E8F9", HoverColor: "#0E7490"}
      - id: Gold
        en: Gold
        fr: Or
        constants: {GlyphColor: "#FACC15", GlyphSubColor: "#EAB308", HighlightGlyphColor: "#88FDE047", HoverColor: "#A16207"}
      - id: Linkin
        en: Hybrid red (Linkin Park)
        fr: Rouge Hybrid (Linkin Park)
        constants: {GlyphColor: "#E63946", GlyphSubColor: "#C1121F", HighlightGlyphColor: "#88FF6B6B", HoverColor: "#780000"}

  - group: Animations
    en: Animations
    fr: Animations
    options:
      - id: Default
        en: Smooth
        fr: Douces
      - id: Fast
        en: Fast
        fr: Rapides
        files: [Presets/Animations/Fast.xaml]
      - id: "Off"
        en: Off
        fr: Désactivées
        files: [Presets/Animations/Off.xaml]

  - group: HeroShade
    en: Shade over the artwork
    fr: Voile sur l'image
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: None
        en: None
        fr: Aucun
        constants: {HeroShadeOpacity: 0}
      - id: Light
        en: Light
        fr: Léger
        constants: {HeroShadeOpacity: 0.35}
      - id: Medium
        en: Medium
        fr: Moyen
        constants: {HeroShadeOpacity: 0.65}
      - id: Strong
        en: Strong
        fr: Fort
        constants: {HeroShadeOpacity: 0.85}

  - group: HeroBackground
    en: Artwork sharpness
    fr: Netteté de l'image
    options:
      - id: Default
        en: Sharp
        fr: Nette
      - id: Soft
        en: Soft blur
        fr: Flou léger
        files: [Presets/Background/SoftBlur.xaml]
      - id: Strong
        en: Strong blur
        fr: Flou fort
        files: [Presets/Background/StrongBlur.xaml]

  - group: BackgroundVertical
    en: Artwork vertical position
    fr: Position verticale de l'image
    options:
      - id: Default
        en: Center
        fr: Centre
      - id: Top
        en: Top
        fr: Haut
        files: [Presets/Background/AlignTop.xaml]
      - id: Bottom
        en: Bottom
        fr: Bas
        files: [Presets/Background/AlignBottom.xaml]

  - group: BackgroundHorizontal
    en: Artwork horizontal position
    fr: Position horizontale de l'image
    options:
      - id: Default
        en: Left
        fr: Gauche
      - id: Center
        en: Center
        fr: Centre
        files: [Presets/Background/AlignCenter.xaml]
      - id: Right
        en: Right
        fr: Droite
        files: [Presets/Background/AlignRight.xaml]

  - group: HeaderBar
    en: Header bar (time played, last played...)
    fr: Barre d'en-tête (temps de jeu, dernière partie...)
    options:
      - id: Default
        en: From the global style
        fr: Selon le style global
      - id: Tiles
        en: Tiles (rounded boxes under the card)
        fr: Tuiles (cases arrondies sous la carte)
        constants: &tiles_look {HeaderBarBlurOpacity: 0, HeaderBarGlassOpacity: 0, HeaderRowBackgroundOpacity: 0, HeaderRowPadding: '0,14,0,0',
                                HeaderTileBackgroundOpacity: 0.08, HeaderTileCornerRadius: 14, HeaderTilePadding: '16,10,16,10',
                                HeaderTileMargin: '0,0,12,0', HeaderBarStyleVisible: True}
      - id: TilesOutline
        en: Outlined tiles
        fr: Tuiles à contour léger
        constants: {<<: *tiles_look, HeaderTileBackgroundOpacity: 0.04, HeaderTileCornerRadius: 10}
      - id: TilesCompact
        en: Compact tiles
        fr: Tuiles compactes
        constants: {<<: *tiles_look, HeaderTilePadding: '10,6,10,6', HeaderTileMargin: '0,0,8,0', HeaderTileCornerRadius: 10, HeaderRowPadding: '0,10,0,0'}
      - id: Glass
        en: Frosted glass bar
        fr: Barre en verre dépoli
        constants: &plain_bar {HeaderBarBlurOpacity: 1, HeaderBarGlassOpacity: 1, HeaderRowBackgroundOpacity: 1, HeaderRowPadding: '20,10,30,10',
                               HeaderTileBackgroundOpacity: 0, HeaderTileCornerRadius: 0, HeaderTilePadding: 0, HeaderTileMargin: '20,0,0,0',
                               HeaderBarStyleVisible: True}
      - id: Solid
        en: Solid bar
        fr: Barre opaque
        constants: {<<: *plain_bar, HeaderBarBlurOpacity: 0}
      - id: Transparent
        en: Transparent bar
        fr: Barre transparente
        constants: {<<: *plain_bar, HeaderBarBlurOpacity: 0, HeaderBarGlassOpacity: 0}
      - id: Hidden
        en: Hidden
        fr: Masquée
        constants: {HeaderBarStyleVisible: False}

  - group: BackgroundBlur
    en: Blurred background behind the information
    fr: Fond flouté derrière les informations
    options:
      - id: Default
        en: Normal
        fr: Normal
      - id: "Off"
        en: Off
        fr: Désactivé
        constants: {DetailsViewBackgroundBlurOpacity: 0, GridViewBackgroundBlurOpacity: 0}
      - id: Light
        en: Light
        fr: Léger
        constants: {DetailsViewBackgroundBlurOpacity: 0.15, GridViewBackgroundBlurOpacity: 0.15}
      - id: Strong
        en: Strong
        fr: Fort
        constants: {DetailsViewBackgroundBlurOpacity: 0.5, GridViewBackgroundBlurOpacity: 0.5}


# Color profiles: complete palettes. tools/color_profiles.py derives every color of Constants.xaml
# from the 13 base colors and build_options.py writes Presets/Colors/<id>.xaml plus the
# "Color profile" drop-down (placed before the Accent list, which can still override the accent).
# Base colors: bg_deep (window edges, lists), bg (window center), panel (top panel, popups),
# control (inputs, cards), text, text_dim, accent, accent2 (install button, gradients), play,
# positive / mixed / negative (ratings), orange (unsaved changes marker).
# The theme draws white text over artwork and buttons, so every profile is dark.
color_profiles:
  group: {en: Color profile, fr: Profil de couleurs}
  insert_before: Accent
  default: {en: Neon (theme colors), fr: Neon (couleurs du thème)}
  profiles:
    - id: DuneSand
      en: Dune sand (amber on warm brown)
      fr: Sable de Dune (ambre sur brun chaud)
      palette: {bg_deep: "#120E0A", bg: "#2A2118", panel: "#1A1510", control: "#3A2F24", text: "#EDE3D3", text_dim: "#A8988A",
                accent: "#FFB547", accent2: "#E8912D", play: "#D98E2B", positive: "#A8C77A", mixed: "#F2D16B", negative: "#E06C5A", orange: "#FF9F1C"}
    - id: HybridRed
      en: Hybrid red (red on charcoal)
      fr: Rouge Hybrid (rouge sur anthracite)
      palette: {bg_deep: "#0B0B0C", bg: "#232325", panel: "#141415", control: "#2E2E31", text: "#ECECEC", text_dim: "#9C9C9F",
                accent: "#E63946", accent2: "#C1121F", play: "#C1121F", positive: "#7FD48A", mixed: "#F4D35E", negative: "#FF5A5F", orange: "#F08A4B"}
    - id: OledBlack
      en: OLED black (true black, ice blue)
      fr: Noir OLED (noir pur, bleu glacier)
      palette: {bg_deep: "#000000", bg: "#0A0A0B", panel: "#000000", control: "#1A1A1C", text: "#F2F2F2", text_dim: "#8E8E93",
                accent: "#4CC2FF", accent2: "#2A9DF4", play: "#22A06B", positive: "#4ADE80", mixed: "#FACC15", negative: "#F87171", orange: "#FB923C"}
    - id: Synthwave
      en: Synthwave (magenta and cyan on night purple)
      fr: Synthwave (magenta et cyan sur violet nuit)
      palette: {bg_deep: "#0D0221", bg: "#2A1050", panel: "#170A35", control: "#34195E", text: "#F5E9FF", text_dim: "#B39DDB",
                accent: "#FF2A6D", accent2: "#05D9E8", play: "#D61C7A", positive: "#5CF2A4", mixed: "#FFD319", negative: "#FF4365", orange: "#FF8F40"}
    - id: Nord
      en: Nord (frost blue, arctic grey)
      fr: Nord (bleu givre, gris arctique)
      palette: {bg_deep: "#242933", bg: "#2E3440", panel: "#272C36", control: "#3B4252", text: "#ECEFF4", text_dim: "#A0A8B7",
                accent: "#88C0D0", accent2: "#5E81AC", play: "#A3BE8C", positive: "#A3BE8C", mixed: "#EBCB8B", negative: "#BF616A", orange: "#D08770"}
    - id: Dracula
      en: Dracula (purple and pink)
      fr: Dracula (violet et rose)
      palette: {bg_deep: "#191A21", bg: "#282A36", panel: "#21222C", control: "#44475A", text: "#F8F8F2", text_dim: "#A4A9C9",
                accent: "#BD93F9", accent2: "#FF79C6", play: "#50FA7B", positive: "#50FA7B", mixed: "#F1FA8C", negative: "#FF5555", orange: "#FFB86C"}
    - id: Catppuccin
      en: Catppuccin Mocha (pastel mauve)
      fr: Catppuccin Mocha (mauve pastel)
      palette: {bg_deep: "#11111B", bg: "#1E1E2E", panel: "#181825", control: "#313244", text: "#CDD6F4", text_dim: "#A6ADC8",
                accent: "#CBA6F7", accent2: "#89B4FA", play: "#A6E3A1", positive: "#A6E3A1", mixed: "#F9E2AF", negative: "#F38BA8", orange: "#FAB387"}
    - id: TokyoNight
      en: Tokyo Night (city blue and violet)
