# Color profiles: complete palettes. tools/color_profiles.py derives every color of Constants.xaml
# from the 13 base colors and build_options.py writes Presets/Colors/<id>.xaml plus the
# "Color profile" drop-down (placed before the Accent list, which can still override the accent).
# Base colors: bg_deep (window edges, lists), bg (window center), panel (top panel, popups),
# control (inputs, cards), text, text_dim, accent, accent2 (install button, gradients), play,
# positive / mixed / negative (ratings), orange (unsaved changes marker).
# The theme draws white text over artwork and buttons, so every profile is dark.
color_profiles:
  group: {en: Color profile, fr: Profil de couleurs}
  insert_before: Accent
  default: {en: Neon (theme colors), fr: Neon (couleurs du thème)}
  profiles:
    - id: Liquid
      en: Liquid (cool graphite, system blue)
      fr: Liquid (graphite froid, bleu système)
      palette: {bg_deep: "#0B0D11", bg: "#1A1D23", panel: "#12141A", control: "#262A32", text: "#F2F4F7", text_dim: "#9BA3AE", accent: "#4DA3FF",
                accent2: "#6E7BFF", play: "#30C75A", positive: "#34C759", mixed: "#FFD60A", negative: "#FF453A", orange: "#FF9F0A"}
    - id: Midnight
      en: Midnight (deep blue)
      fr: Minuit (bleu profond)
      palette: {bg_deep: "#060A12", bg: "#111A2C", panel: "#0B1220", control: "#1B2742", text: "#EAF0FF", text_dim: "#93A0BF", accent: "#5AA9FF",
                accent2: "#7C6CFF", play: "#2FB868", positive: "#4ADE80", mixed: "#FACC15", negative: "#FB7185", orange: "#FB923C"}
    - id: Graphite
      en: Graphite (neutral greys)
      fr: Graphite (gris neutres)
      palette: {bg_deep: "#0F1011", bg: "#1C1D1F", panel: "#151617", control: "#2A2B2E", text: "#ECECEC", text_dim: "#9C9DA1", accent: "#D6DAE0",
                accent2: "#8E949C", play: "#4E9A68", positive: "#86C98A", mixed: "#E3C567", negative: "#E07A7A", orange: "#E0A060"}
    - id: OledBlack
      en: OLED black (true black, ice blue)
      fr: Noir OLED (noir pur, bleu glacier)
      palette: {bg_deep: "#000000", bg: "#0A0A0B", panel: "#000000", control: "#1A1A1C", text: "#F2F2F2", text_dim: "#8E8E93", accent: "#4CC2FF",
                accent2: "#2A9DF4", play: "#22A06B", positive: "#4ADE80", mixed: "#FACC15", negative: "#F87171", orange: "#FB923C"}
    - id: DuneSand
      en: Dune sand (amber on warm brown)
      fr: Sable de Dune (ambre sur brun chaud)
      palette: {bg_deep: "#100C08", bg: "#211A12", panel: "#17120D", control: "#30271C", text: "#F4EADB", text_dim: "#B4A592", accent: "#F5B451",
                accent2: "#E07B39", play: "#C98A2E", positive: "#A8C77A", mixed: "#F2D16B", negative: "#E06C5A", orange: "#FF9F1C"}
    - id: Ember
      en: Ember (warm red)
